[project]
name = "hq-contracts"
version = "0.1.0"
description = "Hidden Quakes shared data contracts (source of truth for the generated TS)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pandas", "pyarrow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hq_contracts"]
