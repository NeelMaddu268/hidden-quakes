# Signal lane config (H1). Parsed by hq.config.signal.SignalConfig; unknown keys are an error.
# One block per ticket. Every pipeline knob of the signal lane lives here and is recorded in run.json.

# --- SEIS-01: station inventory and channel selection ------------------------------------------------
# Cache layout (fixed, shared with hq.ingest.cache): data/cache/stationxml/ holds the raw channel XML,
# <Station.id>.xml response files for read_inventory, and the DEM and availability caches.
stations:
  query:
    fdsnClient: EARTHSCOPE      # ObsPy >= 1.5 key for https://service.earthscope.org
    timeoutS: 180
    network: "*"
    station: "*"
    location: "*"
    channel: "*"                # everything; the rules below decide what is usable
    excludeNetworks: [SY]       # SY = synthetic seismograms, not recorded data
    skipRestricted: true
    retries: 3                  # station service: transport errors and timeouts only
    backoffS: 5.0
  channels:
    verticalComponents: [Z]
    horizontalPairs: [[N, E], ["1", "2"]]   # N/E preferred, else 1/2
    # Velocity sensors, best first (band+instrument). Borehole geophones beat surface short period.
    # Codes not listed (e.g. BH at 40 Hz, FH above 1000 Hz) have no preprocess profile anyway.
    velocityCodes: [GH, GP, DH, DP, CH, CP, HH, HP, EH, EP, SH, SP]
    # Accelerometers: only when the site (net.sta) has no usable velocity triplet.
    accelerometerCodes: [GN, DN, CN, HN, EN]
    componentDepthTolM: 1.0
    locationDepthTolM: 5.0
    coordTolM: 50.0
  kind:
    boreholeMinDepthM: 10.0
    strongMotionInstrumentCodes: [N]
    boreholeLookingCodes: [GH, GP, DH, DP]
  # First match on sampleRateHz (inclusive). The ranges equal each profile's minRateHz/maxRateHz in
  # the preprocess block (SEIS-03), so every station inventory accepts is one for_picking accepts.
  # Triplets with no matching rule are dropped before ranking.
  profiles:
    - {minRateHz: 100, maxRateHz: 100, profile: surface-100}
    - {minRateHz: 200, maxRateHz: 250, profile: surface-hi}
    - {minRateHz: 500, maxRateHz: 1000, profile: borehole-A}
  elevation:
    # StationXML is inconsistent about whether station elevation is the surface or the sensor.
    # Each chosen sensor's station elevation is checked against this DEM (USGS 3DEP via EPQS).
    # The DEM cache file name carries a hash of demUrl, so another DEM never reuses these values.
    demUrl: https://epqs.nationalmap.gov/v1/json
    demTimeoutS: 30
    demRetries: 3
    demBackoffS: 2.0
    demNoDataValue: -1000000
    demCacheFile: surface_elev_dem.json
    demKeyDecimals: 5
    toleranceM: 15.0            # a reading matches when within this of the DEM
    onAmbiguous: error          # deeper than toleranceM and neither reading matches
    maxShallowMismatchM: 50.0   # shallow sensor off the DEM: flagged up to this, then:
    onShallowMismatch: dem      # use the DEM as the ground surface (coordinates are trusted)
  availability:
    # The FDSN availability service is retired at EarthScope (404 / 410); MUSTANG daily
    # percent_availability is the working source. Coverage is the overlap-weighted daily value,
    # an estimate below one day; SEIS-05's measured gaps are the real answer.
    url: https://service.earthscope.org/mustang/measurements/1/query
    metric: percent_availability
    timeoutS: 60
    retries: 3
    backoffS: 2.0
    cacheFile: availability_mustang.json   # raw replies; delete it to re-query
    onMissing: used             # no measurement (MUSTANG lag): coverage null, usedInRun true
    onMissingNoProbeData: unused  # ...unless no rate probe got data either (full-day window)
  rateCheck:
    # StationXML can disagree with the data (an epoch saying 200 Hz that serves 100 Hz). The
    # profile follows the rate, so each chosen triplet is probed with a few seconds of dataselect.
    probeS: 5.0
    probeOffsetsS: [0.0, 21600.0, 43200.0, 64800.0]   # first probe with data wins
    relTol: 1.0e-4
    timeoutS: 60
    retries: 2
    backoffS: 2.0
    cacheFile: rate_probe.json  # probe results; delete it to re-probe
    onMismatch: data            # use the served rate and its profile; flagged in the report
    onNoData: metadata          # nothing served at any probe: keep the StationXML rate, flagged

# --- SEIS-05: full-window download and cache ---------------------------------------------------------
download:
  client: EARTHSCOPE        # ObsPy FDSN client base (service.earthscope.org)
  timeoutS: 180             # dataselect can stall for minutes before answering
  chunkS: 3600              # one request per station per hour, epoch-aligned
  padS: 300                 # +/- 5 min around the run window
  maxWorkers: 6             # parallel (station, UTC day) units
  maxRetries: 4             # retries per chunk on timeouts, 5xx and connection errors
  backoffBaseS: 5           # retry k waits min(backoffBaseS * 2**k, backoffMaxS)
  backoffMaxS: 120
  provisionalLagS: 3600     # a chunk fetched less than this after its end is refetched later
  minGapSamples: 1.5        # sample spacing above 1.5 intervals is a gap; below is jitter
  maxGapFraction: 0.2       # Check A: useful = 3 components and gap fraction below this
  minUsefulStations: 12     # Check A passes with at least this many useful stations

# --- SEIS-02: known-event windows --------------------------------------------------------------------
# Windows around the largest public-catalog events in the run window and bbox. They are read from
# the shared waveform cache that SEIS-05's downloader fills; SEIS-02 never writes to the cache.
# They feed Check B and the picker weight A/B (SEIS-04).
known:
  nEvents: 3            # largest public events by magnitude; ties go to the earlier origin time
  preS: 120.0           # s before the catalog origin time (noise context ahead of the P arrival)
  postS: 480.0          # s after it; preS + postS = 600 s, the ticket's 10-minute window
  minGapSamples: 1.5    # a hole longer than (minGapSamples - 1) sample intervals is a gap, so one
                        # missing sample is a gap and sub-sample jitter is not; same rule as SEIS-05
  maxGapFraction: 0.2   # a station is usable only if its gappiest component misses <= 20 %
  minStations: 8        # usable three-component stations a window needs to PASS
  usedInRunOnly: true   # consider only stations.parquet rows with usedInRun = true

# --- SEIS-03: preprocessing profiles -----------------------------------------------------------------
# Counts stay counts (no response removal): PhaseNet normalizes internally. Gaps are never bridged
# or filled; every gap-separated segment is processed on its own (abutting pieces are joined first).
preprocess:
  targetRateHz: 100.0        # PhaseNet input rate; every for_picking output trace has exactly this rate
  rateRelTol: 1.0e-9         # relative tolerance when matching an input rate to targetRateHz * M / L
  maxUpsampleFactor: 2       # largest L in rate * L / M = target (250 Hz: x2 then /5); more -> raise
  minSegmentModelS: 31.0     # shorter segments are dropped and counted. Model seconds (real s x TimeMap
                             # factor). PhaseNet's window is 3001 samples = 30 s at 100 Hz; SeisBench
                             # cannot window a shorter segment and would drop or merge it on its own
                             # (with only a warning), so drop it here where it is counted. +1 s slack
  joinMisalignmentSamples: 0.01   # pieces of one channel that abut (or overlap identically) with sample
                                  # grids this close, in input samples, are joined; conflicting overlaps raise
  detrend: linear
  taper:                     # per segment, ObsPy Trace.taper
    type: hann
    maxPercentage: 0.05
    maxLengthS: 1.0
  antiAlias:                 # Chebyshev II, zero-phase, before every decimation; edges x output Nyquist
    passbandEdgeFraction: 0.8     # 40 Hz at 100 Hz output
    stopbandEdgeFraction: 1.0     # 50 Hz at 100 Hz output: nothing that can fold survives
    passbandLossDb: 1.0           # per pass
    stopbandAttenuationDb: 60.0   # per pass (zero-phase applies it twice)
  componentRename: {"1": "N", "2": "E"}   # borehole horizontals of uncertain orientation, on a copy
  modelComponents: ZNE       # every output trace must end in one of these (seisbench order "ZNE")
  profiles:
    surface-100:             # 100 Hz surface channels: detrend, taper, no filter
      method: passthrough
      minRateHz: 100.0
      maxRateHz: 100.0
    surface-hi:              # 200-250 Hz surface channels
      method: decimate
      minRateHz: 200.0
      maxRateHz: 250.0
      lowpassHz: 40.0
      lowpassCorners: 4
    borehole-A:              # default for borehole geophones (~1000 Hz, also 500 Hz)
      method: decimate
      minRateHz: 500.0
      maxRateHz: 1000.0
      lowpassHz: 40.0
      lowpassCorners: 4
    borehole-B:              # experiment: bandpass, relabel as 100 Hz; picks return via TimeMap
      method: stretch
      minRateHz: 1000.0
      maxRateHz: 1000.0
      bandpassHz: [5.0, 400.0]   # real Hz; at 1000 Hz input the model sees 0.5-40 Hz
      bandpassCorners: 4
  # Full-window picking reads the cache one chunk at a time (hq.preprocess.chunks), so PhaseNet
  # (SEIS-06) and STA/LTA (SEIS-07) see identical preprocessed traces. [t0, t1) is tiled into keep
  # intervals; each is read with overlapS extra on both sides, preprocessed on its own, and a
  # picker keeps only the picks inside the keep interval (the rest belong to the neighbour).
  chunks:
    lengthS: 3600.0          # keep intervals sit on multiples of this since the epoch (hours),
                             # clipped to the window, so a sub-window run reproduces the full run's chunks
    overlapS: 60.0           # real s read before and after every keep interval, then discarded
    minOverlapS: 32.0        # overlapS may not go below this: one full PhaseNet window (3001 samples = 30 s
                             # of model time, at most 30 s real; with SeisBench's overlap 1500 and avg
                             # stacking a sample is covered by windows that start up to 30 s earlier) +
                             # taper (maxLengthS 1 s) + zero-phase filter settling (below 1 s for these
                             # filters). The baseline adds its own run-time checks (STA/LTA warm-up and LTA
                             # settling, gap-edge distance). SeisBench anchors its window grid at each trace
                             # start, so PhaseNet's stacked probabilities near a keep boundary can still
                             # differ between neighbouring chunks (a SEIS-06 concern, not fixed by overlap)
    edgeProbeS: 1.0          # every read reaches this much further, so data that continues past a chunk
                             # cut is told apart from a real data edge (gap, or data start/end). Must
                             # exceed one input sample interval (checked per trace) and stay below overlapS

# --- SEIS-04 / SEIS-06: PhaseNet picking -------------------------------------------------------------
picker:
  model: seisbench.PhaseNet
  weightsVersion: "2"                      # pinned; from_pretrained never queries the remote
  candidateWeights: [instance, stead, original, scedc]
  defaultWeights: instance                 # placeholder until known/ab.csv names the winners
  weightsByProfile:                        # placeholders; copy the A/B winners in here
    surface-100: instance
    surface-hi: instance
    borehole-A: instance
    borehole-B: instance
  pThreshold: 0.1                          # store everything >= 0.1; H2 filters later
  sThreshold: 0.1
  gapEdgeS: 1.0                            # real s; picks this close to a block edge (A/B) or to a
                                           # raw data edge (full window, hq.pick.run) are dropped
  batchSize: 256
  torchThreads: 4
  seed: 0
  seisbench:                               # passed verbatim to classify(); beats weight defaults
    overlap: 1500
    stacking: avg
    blinding: [250, 250]                   # samples with no output at each block edge; sum <= overlap
    strict: true
    flexibleHorizontalComponents: false    # for_picking already renamed 1/2 to N/E
  run:                                     # SEIS-06 full-window picking (hq.pick.run). The profile per
                                           # station is stations.parquet's preprocessProfile: to adopt an
                                           # A/B variant (known/ab.json), change stations.profiles and
                                           # rerun the inventory; the stage warns while they disagree
    workers: 6                             # station-parallel worker processes (spawned; each loads its
                                           # model once per weights); 1 runs in-process. Does not change
                                           # the picks: results are assembled in station order
    torchThreadsPerWorker: 3               # torch intra-op threads per worker: 6 x 3 = 18 of 24 logical
                                           # cores. picker.torchThreads stays the single-process A/B value.
                                           # 1, 3 and 12 threads gave identical picks when checked; torch
                                           # does not promise that in general
    onCacheMiss: error                     # usedInRun station with no cached file at all: error (stop
                                           # before any picking, listing every such station) | report
                                           # (zero picks, reason in pick_report.json). Manifest-only
                                           # (nodata) stations count as cached: "no data in window"
  ab:
    profileVariants:
      borehole-A: [borehole-B]
    minStationsForRho: 3
    arrivalWindow:                         # picks that may belong to the event, vs catalog origin
      preOriginS: 2.0                      # allowance before the catalog origin time
      minVelocityMps: 2000.0               # latest pick: origin + hypoDist / this + postMarginS
      postMarginS: 5.0
    recordSection:
      bandHz: [2.0, 20.0]
      windowS: [-5.0, 30.0]
      padS: 5.0
      component: Z
      widthIn: 10.0
      heightPerTraceIn: 0.45
      minHeightIn: 4.0
      dpi: 120
      traceHalfHeight: 0.45
    checkB:
      minStationsPS: 8
      minRho: 0.8
      minEventsPass: 3

# --- SEIS-07: STA/LTA baseline -----------------------------------------------------------------------
# Classical picks (ObsPy recursive_sta_lta + trigger_onset) on exactly the chunks PhaseNet sees
# (hq.preprocess.chunks), kept or dropped by the same rule and the same distance, picker.gapEdgeS.
# P from Z, S from the horizontals after a P. Windows are REAL seconds, so a time-stretched
# borehole-B trace gets the same physical windows (factor x more model samples).
baseline:
  # STA/LTA has no calibrated confidence, so every trigger gets prob 1.0. The swept trigger thresholds
  # below are the baseline's only tuning dimension: no association probability threshold ever drops a
  # baseline pick. A baseline event's meanPickProb is therefore always 1.0 and says nothing about
  # confidence; it is not comparable with a PhaseNet event's.
  prob: 1.0
  minSegmentMarginS: 5.0     # a segment shorter than warmupS + 5 s is skipped and counted (its first
                             # warmupS can never trigger)
  maxWorkers: 4              # stations in parallel (threads: the C STA/LTA, filters and mseed reads
                             # release the GIL); 1 runs inline
  settleLtaMultiple: 10.0    # preprocess.chunks.overlapS must hold 10 x ltaS of data ahead of a keep start
                             # (ahead of keep start - maxSMinusPS for P). The recursive LTA forgets its zero
                             # start as exp(-t / ltaS), so at a keep start the CF of two chunkings differs
                             # by < exp(-10) = 5e-5 and picks do not depend on where the chunks are cut
  # Causal Butterworth bandpass before the STA/LTA, per preprocessing profile, in real Hz (every
  # profile needs one). It removes microseism and long-period drift, which would otherwise dominate the
  # LTA of raw counts, and it keeps picks independent of the chunking (for_picking's linear detrend
  # runs per chunk). This filter adds no precursor of its own (the zero-phase filters inside
  # for_picking still do), but it delays onsets by its group delay, more at low frequency: for 2-30 Hz
  # about 135 ms at 3 Hz, 47 ms at 5 Hz and 18-25 ms at 8-20 Hz, so S (lower frequency) is biased
  # later than P. PhaseNet sees the whole preprocessed band: up to 40-50 Hz at the 100 Hz model rate,
  # 5-400 Hz real for borehole-B.
  prefilter:
    surface-100: {lowHz: 2.0, highHz: 30.0, corners: 4}
    surface-hi: {lowHz: 2.0, highHz: 30.0, corners: 4}
    borehole-A: {lowHz: 2.0, highHz: 30.0, corners: 4}
    borehole-B: {lowHz: 20.0, highHz: 300.0, corners: 4}   # the same 2-30 Hz on the model's time axis
                                                            # (factor 10), where borehole-B's energy is
  p:
    components: Z
    staS: 0.1                # lane doc range: STA 0.05-0.1 s, LTA 2-5 s at 100 Hz. Windows are not swept;
    ltaS: 2.0                # the sweep varies the trigger thresholds only
    warmupS: 6.0             # 3 x ltaS: the recursive LTA starts from zero at every segment start, so the
                             # ratio is inflated there and the CF is zeroed for this long. After a gap this,
                             # not picker.gapEdgeS, is the real exclusion; triggers suppressed inside it
                             # (and not already within gapEdgeS of the edge) are counted, suppressedWarmupP/S
  s:
    components: NE           # borehole 1/2 arrive renamed to N/E by for_picking
    staS: 0.1
    ltaS: 4.0
    warmupS: 12.0            # 3 x ltaS
  # S, per P of the same station (a P within picker.gapEdgeS of a data edge does not count; S picks
  # lost that way are counted): each horizontal is searched on its own, from the P onset. On one
  # horizontal, a trigger that is on at any time within pHorizontalTolS of the P onset is the P's own
  # energy there, never an S, and the search on that component starts once it has turned off. The
  # component's S is its earliest other trigger starting in [tP + minSMinusPS, tP + maxSMinusPS]; the
  # pick is the earlier of the two components'. The window spans hypocentral distances from a few
  # hundred metres (borehole sensors above the seismicity) to the far side of the bbox. One S per P;
  # two Ps choosing the same trigger give one S. Earliest rather than strongest: the first new
  # horizontal energy is the onset, a later and stronger trigger is more often coda. Known limits of
  # classical S picking: when P energy keeps a horizontal trigger on until the S arrives, that S has
  # no onset of its own on that component, and an S less than about pHorizontalTolS after its P is
  # taken for the P (docs/02 BaselineGain also scores a p_only association).
  pHorizontalTolS: 0.3       # P reaches all three components at once, but an emergent P can cross a
                             # horizontal's trigger level a few tenths of a second after the vertical: a
                             # trigger on within 0.3 s of the P onset is the P. Evidence (SEIS-07 PR, run
                             # preview-checkb): against PhaseNet's S picks on the known events it kept
                             # every PhaseNet-consistent S of the plain earliest-onset rule, and on a live
                             # hour it removed most S picks just after their P (P-coda re-triggers).
                             # Joining both horizontals into one trigger list lost many consistent S picks
  minSMinusPS: 0.15
  maxSMinusPS: 5.0
  # Thresholds of picks_stalta.parquet; must be a point of the sweep grid, and the start of the
  # coordinate search below. Provisional: the lane doc asks for the sweep point with the most Tier A
  # events. A scored sweep logs its best Tier A point (ties keep this one) and warns while it differs
  # from this one; copy it here once the scoring run is done.
  chosen:
    pOn: 5.0
    pOff: 1.5
    sOn: 5.0
    sOff: 1.5
  # Grid pOn x sOn x offLevels; each off level serves both phases at that point. The characteristic
  # function is computed once per segment; every grid point only re-runs trigger_onset. Off is an
  # absolute level, not a fraction of on: with a fixed off a higher on can only remove a trigger or
  # move its onset later (each run of the CF above off holds at most one trigger), so the P count
  # falls or stays as pOn rises, except where a later onset leaves a data-edge zone or crosses the
  # run window start. An off tied to on could split one trigger into two. The S count is not
  # strictly monotone either: a later S onset, or a later P, can move a trigger into an S window.
  sweep:
    pOn: [3.0, 4.0, 5.0, 6.0, 8.0, 10.0, 12.0]
    sOn: [3.0, 4.0, 5.0, 6.0, 8.0, 10.0, 12.0]
    offLevels: [1.0, 1.5, 2.0]
    # Scoring: a grid point's picks go through H2's associate -> locate -> match -> assign_tiers
    # exactly as H4's VAL-01 scores its BaselineRow (profile full, the run's own tier bars from
    # ProcessingRun.tiering), and PhaseNet's picks.parquet is scored once the same way as the
    # reference (baseline_reference.json). The run's tier bars exist only after stage tier, which the
    # pipeline runs after this stage, so a fresh `hq run` cannot score: this stays none, and the sweep
    # is scored by rerunning the stage on a run that went through tier, e.g.
    #   python -m hq.baseline.run --run-dir <run> --config-dir configs/showcase --cache-dir <cache>
    #     --score-mode coordinate --score-only
    # (or `hq stage baseline` with scoreMode set here). A scoring run on a run without tier bars
    # fails before it picks anything. One point is a full H2 run: minutes each.
    scoreMode: none          # all: every grid point; coordinate: coordinate descent from chosen (vary
                             # pOn at chosen sOn/off, then sOn, then off; repeat passes until one moves
                             # nowhere; ties keep the incumbent, then grid order); none: pick counts only
    scoreWorkers: 3          # grid points scored at once, each in its own spawned process; every H2
                             # locate call inside also spawns seismology.locator.nWorkers processes.
                             # 1 scores in this process
    maxPasses: 3             # coordinate mode: at most this many passes over pOn, sOn and off
