# Signal lane config (H1). Parsed by hq.config.signal.SignalConfig; unknown keys are an error.
# One block per ticket. Every pipeline knob of the signal lane lives here and is recorded in run.json.

# --- SEIS-01: station inventory and channel selection ------------------------------------------------
stations: {}

# --- SEIS-05: full-window download and cache ---------------------------------------------------------
download: {}

# --- SEIS-02: known-event windows --------------------------------------------------------------------
# Windows around the largest public-catalog events in the run window and bbox. They are read from
# the shared waveform cache that SEIS-05's downloader fills; SEIS-02 never writes to the cache.
# They feed Check B and the picker weight A/B (SEIS-04).
known:
  nEvents: 3            # largest public events by magnitude; ties go to the earlier origin time
  preS: 120.0           # s before the catalog origin time (noise context ahead of the P arrival)
  postS: 480.0          # s after it; preS + postS = 600 s, the ticket's 10-minute window
  minGapSamples: 1.5    # a hole longer than (minGapSamples - 1) sample intervals is a gap, so one
                        # missing sample is a gap and sub-sample jitter is not; same rule as SEIS-05
  maxGapFraction: 0.2   # a station is usable only if its gappiest component misses <= 20 %
  minStations: 8        # usable three-component stations a window needs to PASS
  usedInRunOnly: true   # consider only stations.parquet rows with usedInRun = true

# --- SEIS-03: preprocessing profiles -----------------------------------------------------------------
preprocess: {}

# --- SEIS-04 / SEIS-06: PhaseNet picking -------------------------------------------------------------
picker: {}

# --- SEIS-07: STA/LTA baseline -----------------------------------------------------------------------
baseline: {}
