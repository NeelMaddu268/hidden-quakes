# Seismology lane config (H2). Parsed by hq.config.seismology.SeismologyConfig; unknown keys are an error.
# Every seismology knob lives here and is recorded in ProcessingRun (docs/02 -> Config files).
# The run window and bbox come from run.yaml; nothing here repeats them.

velocity:
  # 1D layer model (LOC-01), relative to services/seismic. Its '#' header holds the source,
  # license, the source datum and its evidence, and the conversion to elevM (m ASL, up positive).
  layerFile: configs/velocity/forge_1d.csv
  # Unit guard, not a physical fit: the loader rejects a layer file with any Vp or Vs (m/s) outside
  # [min, max]. Catches a file written in km/s (values below 10) under the m/s column names.
  plausibleVpMPerS: [300.0, 9000.0]
  plausibleVsMPerS: [100.0, 5000.0]
  # Unit guard: the loader rejects a layer thinner than this (m). Catches topElevM written in km.
  minLayerThicknessM: 10.0
  # Largest upward extension of the top layer (m above the source model's own top) that
  # with_top_extended_to accepts. It must cover the highest receiver; a larger request raises, so a
  # sensor elevation in feet or a sentinel value can't stretch the top layer silently.
  maxTopExtensionM: 1000.0
  # Display only: the profile figure draws the half-space down to this elevation (m ASL).
  profilePlotBottomElevM: -2000.0
  # 3D model for LOC-07 (hq.locate.tt_grid3d), downloaded into data/cache/velocity/<cacheFile>.
  # Checked in the file (LOC-01) and confirmed against the paper (LOC-07; evidence in the
  # tt_grid3d docstring and in diagnostics.md's 3D section):
  # - Vp and Vs are float64 in km/s (basement 5.8 / 3.392); the 1D layer file is in m/s.
  # - Dims (northing 601, easting 601, elevation 201), 50 m spacing, elevation -7000..3000 m.
  # - No CRS attributes anywhere (spatial_ref has none). easting/northing are EPSG:32612 (UTM
  #   zone 12N) metres, confirmed: the ground surface in the model's basin columns matches the
  #   3DEP terrain in the run's ENU frame at zero shift (sub-metre median difference), and the
  #   ground at the used stations in basin columns lies within a few metres of their surfaceElevM.
  # - elevation is m above sea level (NAVD88, the 3DEP vertical), up positive: Nakata.pdf p. 3
  #   (10 km deep from a maximum altitude of 3000 m, topography from 3DEP) and the same match.
  # - Basin (log-fit) velocities exist only in some columns, all inside E 322350-342250,
  #   N 4248700-4276100. Every other non-NaN column is Vp 5.8 / Vs 3.392 km/s at every elevation,
  #   air included, so the file carries no ground surface there. That covers real basement outcrop
  #   (Mineral Mountains) but also the Milford valley floor west of a near-straight cut at E
  #   ~322350, although Nakata.pdf p. 3 says the top-of-basement surface was extrapolated to the
  #   model limits (and clipped at the topography).
  # - In basin columns, cells above ground hold Vp 0.73271 / Vs 0.40002 km/s (near the p. 3
  #   surface anchors, Vp 736 m/s and Vs30 400 m/s), not the 0.01 km/s p. 3 states. grid3d
  #   .airHandling says what the tables do with them.
  # - Vp and Vs are NaN in a strip at the west edge (E 315300-315400, N 4270750-4276200), all depths.
  model3d:
    submissionUrl: https://gdr.openei.org/submissions/1800
    url: https://gdr.openei.org/files/1800/Cape-model_50m_grid_sonic-logs-only_stretched_3-1-24.nc
    cacheFile: Cape-model_50m_grid_sonic-logs-only_stretched_3-1-24.nc
    expectedBytes: 1161642687
    citation: "Nakata, N., Hopp, C., Wu, S., Robertson, M., & Dadi, S. (2025). Cape EGS and Utah FORGE: Empirical 3D Seismic Velocity Model [Data set]. Geothermal Data Repository, Lawrence Berkeley National Laboratory. https://gdr.openei.org/submissions/1800"
    license: CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)
    units: km/s
    crs: EPSG:32612
    # Above-ground value in basin columns (file units, found in the file; see the comment above).
    airVp: 0.73271
    airVs: 0.40002

# Travel-time tables (LOC-02, hq.locate.tt_grid): one 2D (r, elevM) eikonal table per receiver
# elevation and phase, solved with scikit-fmm with the source at the sensor (reciprocity).
# Cached as .npy under <cache_dir>/ttgrids/, keyed by a hash of every input below.
grids:
  drM: 25.0
  dzM: 25.0
  # Largest epicentral distance in a table (m). Must cover every station-to-search-node distance;
  # the locator raises if a station is farther from a search-volume corner than this. The run bbox
  # corners lie about 36.6 km from the origin and the volume's half diagonal is 14.1 km, so a
  # station anywhere in the bbox needs about 50.7 km.
  rMaxM: 52000.0
  # Grid top = highest receiver sensorElevM (or the search-volume top, if higher) + topMarginM,
  # snapped up onto the dzM lattice. The model's top layer is extended up to it (recorded).
  topMarginM: 100.0
  # Grid bottom (m ASL): at least one dzM below locator.volume.bottomElevM (checked).
  bottomElevM: -8000.0
  # Exact 1D layered times seed every node within this distance of the receiver (m); the
  # eikonal solve starts from an isochron inside it. At least 4 cells (checked).
  seedRadiusM: 500.0
  fmmOrder: 2
  # Each new table is compared with the exact 1D layered times at every elevation node and every
  # Nth distance node; the max error per model layer goes to the sidecar and the run record.
  # Cell-mean slowness makes the tables slow by up to ~14 ms (S) just below shallow interfaces.
  accuracyCheckStrideR: 4

# 3D travel-time tables (LOC-07, hq.locate.tt_grid3d), used when locator.method is grid3d: the 3D
# model (velocity.model3d) resampled to cell-mean slowness on an ENU lattice, one 3D eikonal
# table per receiver and phase with the source at the sensor (reciprocity), cached as .npy under
# <cache_dir>/ttgrids/3d/ keyed by a hash of the model file's SHA-256 and every input below.
# Receivers outside the 3D model use their 1D tables (grids above); the run record names them.
grid3d:
  # The ticket's range is 100-200 m. 200 m builds every table of the showcase stations in about
  # a minute; the 100 m cost is in the LOC-07 acceptance report.
  spacingM: 200.0
  # The model's west edge holds no values in a strip (velocity.model3d above); a lattice cell
  # with none fails the build. 2000 m reached it at 100 m spacing on the showcase stations (LOC-07).
  horizontalMarginM: 1000.0
  topMarginM: 100.0
  # The model's bottom node (the locator volume reaches it; checked against locator.volume).
  bottomElevM: -7000.0
  # topSurfaceVelocity: each identified above-ground cell gets its column's topmost ground
  # velocity, so resampled cells that straddle the ground average only rock, not the file's
  # constant air value. Columns with one value at every elevation carry no ground surface in the
  # file and keep their values (their air already holds that velocity). asFile keeps every value.
  airHandling: topSurfaceVelocity
  # Exact layered times of the receiver's own model column (50 m cells) within this radius (m):
  # the near-surface under the station, which the resampled cells can't hold, enters every
  # table through it. At least 4 cells (checked).
  seedRadiusM: 1000.0
  fmmOrder: 2

# Grid-search locator (LOC-02, hq.locate.locator and hq.locate.uncertainty).
locator:
  # grid1d (the showcase default until the lead decides) or grid3d (LOC-07).
  method: grid1d
  volume:
    halfWidthM: 10000.0 # e and n in [-halfWidthM, +halfWidthM] around the run origin
    # null = run.refSurfaceElevM (the ground at the origin; there is no DEM in a 1D search),
    # snapped down onto the fine lattice.
    topElevM: null
    bottomElevM: -7000.0
  coarseSpacingM: 200.0 # full-volume grid
  fineSpacingM: 25.0 # the reported PDF lives on this lattice
  # First fine box: +/- this around the best coarse node, clipped to the volume. The search
  # starts there; the PDF region grows past it until it covers the mass (locator.py).
  fineHalfWidthM: 1000.0
  # The misfit is first evaluated every fineStageSpacingM, from the first fine box outward until the
  # region within pdfCutoff of the minimum clears every face that is not a volume face; fine nodes
  # are then evaluated over that region and grown the same way (locator.py).
  fineStageSpacingM: 100.0
  # Nodes whose PDF exponent (pdfMisfitScale * misfit) is more than this above its minimum hold
  # < exp(-pdfCutoff) of the peak node's mass; they count as zero mass. The misfit is L1, so PDF
  # tails are near-exponential and the region within the cutoff grows about linearly with it.
  # Measured on weak test events (6 P + 2 S picks, prob 0.5, PDF sd 200-340 m): 12 leaves ~2e-4 of
  # the mass outside and the PDF sd within 0.3% of the untruncated value, on 1.5-2.1M fine nodes
  # (20 would need 6-9M).
  pdfCutoff: 12.0
  # PDF = exp(-pdfMisfitScale * misfit). 1.0 is the ticket's exp(-misfit): the Laplace likelihood
  # with scale sigma / prob. The synthetic test measures how well the "68%" errors cover the true
  # errors on the real geometry; change this only if that measurement says so. Formal errors only.
  pdfMisfitScale: 1.0
  # Most fine nodes one PDF may cover (misfit cost ~27 ns per node and pick). A PDF that needs more
  # is truncated: hErrM and vErrM become None and the search record says pdfTruncated.
  maxPdfNodes: 3000000
  # Pick sigma (s): weight = pick probability / sigma. The Laplace scale of the L1 likelihood.
  pickSigmaS:
    P: 0.02
    S: 0.04
  # Per-profile overrides keyed by Station.preprocessProfile, e.g. {borehole-B: {P: 0.03, S: 0.05}}.
  profilePickSigmaS: {}
  # Drop picks with |residual| > max(madK * MAD, floorS) (MAD unscaled), then relocate once.
  outlier:
    madK: 3.0
    floorS: 0.15
  minPicks: 4
  # hErrM = 68% semi-major axis of the horizontal marginal. docs/02 fixes 68% (vErrM is the vertical
  # 1-sigma), so any other value is rejected.
  errConfidence: 0.68
  # depthOnEdge (docs/02): > this PDF mass on the fine grid's top or bottom face.
  depthOnEdgeMassFraction: 0.05
  # Separate from depthOnEdge: mapOnVolumeTop / mapOnVolumeBottom (EventLocation fields and the
  # search record) are set when the MAP node lies within this distance (m) of the search volume's
  # top / bottom, so a broad PDF pinned at the top is caught even when its face row holds < 5%.
  # One fineStageSpacingM; 0 would mean the face row only.
  mapOnVolumeFaceBandM: 100.0
  nWorkers: 8 # processes for locate_many (spawned); results do not depend on it
  evalChunkNodes: 65536 # nodes per misfit block (memory only)
  enuConsistencyTolM: 0.01 # stations: |enu_u + origin elevM - sensorElevM| must be below this

# Synthetic recovery test (LOC-02, hq.locate.synthetic). Hypocentres are drawn in this zone, picks
# are exact 1D layered times plus Gaussian noise at locator.pickSigmaS, located by the locator.
synthetic:
  nEvents: 200
  seed: 20260925
  # ENU cylinder around the origin covering the depth band of the region's public-catalog
  # activity. These are config values; the code never reads catalog values.
  zone:
    centerEM: 0.0
    centerNM: 0.0
    radiusM: 2000.0
    topElevM: -1000.0
    bottomElevM: -4500.0
  # Stage "locate" runs this test on the run's usedInRun stations and writes synthetic.json.
  # Each station's S pick is kept with probability sKeepProb, and every synthetic pick gets
  # pickProb. null = measured from the run's located events by stage locate: sKeepProb = median
  # over events of nS / nStations, pickProb = median prob of the picks used in the final locations
  # (both recorded in ProcessingRun.locator.synthetic). A number fixes the value instead. Every
  # station still gets a P pick, which keeps the synthetic picks optimistic for weak events.
  sKeepProb: null
  pickProb: null

# Depth diagnostics (LOC-04, hq.locate.diagnostics): stage "locate" writes diagnostics.md with the
# lane doc's table (rows 1-7), each with a result computed from the run and a conclusion.
diagnostics:
  # Row 2 (datum mixing): noise-free P and S picks from the exact 1D layered times at every used
  # station, for a synthetic event at each elevM below (m ASL) at (eM, nM) (ENU m), located by the
  # run's own locator and tables. Passes when |elevM error| and the horizontal error stay within
  # passTolM (LOC-02's noise-free depth-bias bound).
  datumCheck:
    eM: 0.0
    nM: 0.0
    elevM: [-3500.0, -1500.0, 500.0]
    passTolM: 50.0
  minSForDepth: 3 # row 4 compares events with nS >= this against nS < this (lane doc)
  # Fewest events (row 4) or picks (rows 5-7) a group needs before a row draws a conclusion from
  # it; below this the row says it can't conclude and gives the counts.
  minGroupSize: 5
  # Rows 4 and 5: one group's spread (median vErrM, residual MAD) counts as degraded when it
  # exceeds the other's by more than this factor.
  degradationRatio: 1.5
  # Row 6: station-phase median residuals above this (s) are flagged; the lane doc asks for a
  # written explanation of every static above 0.15 s (LOC-05).
  stationResidualFlagS: 0.15
  # Row 5: profiles whose Station.preprocessProfile starts with this are the borehole profiles the
  # row's suspect (borehole picks degraded by resampling) is about; signal.yaml names them so.
  boreholeProfilePrefix: borehole
  # Row 7: the amplitude (s) of a residual ~ a + b cos(az) + c sin(az) fit above this counts as
  # an azimuthal trend (1D misses lateral structure; LOC-07).
  trendFlagS: 0.05
  # Row 7, at the public catalog hypocentres: a mislocated catalog epicentre alone gives P and S
  # trends whose amplitude ratio (S/P) is about the model's Vp/Vs at the source depth, since both
  # scale with the horizontal slowness at the source. A ratio above that Vp/Vs times this factor
  # counts as S-heavy, which a slow/fast lateral contrast gives and a catalog mislocation does not.
  # The margin covers the scatter of amplitudes fitted to a few events.
  trendSPRatioExcess: 1.3
  # Travel-time table error vs the exact layered time (s) at a located hypocentre above this
  # counts as exposure to the tables' cell-mean interface bias (LOC-02: up to ~14 ms for S just
  # below shallow interfaces).
  tableErrorFlagS: 0.005

# Station statics (LOC-05, hq.locate.statics): one additive term per station and phase, applied in
# the locator (tPred = origin time + table time + static). Every static above
# diagnostics.stationResidualFlagS gets a written explanation in diagnostics.md.
statics:
  # selfConsistent: the lane doc's method, inside locate(). referenceEvents: terms at the public
  # regional catalog's hypocentres of the matched events (needs matches.parquet in the run dir:
  # locate -> match -> locate -> match -> tier); without it locate runs with no statics.
  mode: referenceEvents
  # selfConsistent: median residual per station-phase over the used picks of well-constrained
  # events, subtracted, every event relocated; iterations times; each static capped at +/- capS.
  iterations: 3
  capS: 0.3
  minEvents: 5
  wellConstrained: # depthOnEdge events and truncated PDFs (null hErrM) never count
    minStations: 8
    minS: 3
    maxGapDeg: 180.0
  # referenceEvents: residuals at each reference hypocentre (the catalog's, fixed; origin time by
  # the locator's weighted median), term = median over reference events, alternated with the
  # origin times polishIterations times (median polish). A station-phase with fewer than
  # minReferenceEvents reference events gets 0 (nEvents in statics.parquet shows it). Every
  # reference event is relocated with terms computed without it: folds null = leave-one-out,
  # k = k-fold (folds dealt round-robin in catalog origin-time order). Unmatched candidate events
  # use the terms from every reference event.
  minReferenceEvents: 3
  # The lateral-structure terms exceed selfConsistent's 0.3 s cap by design (LOC-04 row 7: S
  # delays near 1 s at the catalog hypocentres), so this cap is set from the data: above the
  # largest consistent term (small MAD over its events), so it clips none of the lateral
  # structure, and still bounding a term from a station with systematically wrong picks.
  # diagnostics.md reports, per run, the largest uncapped term, its MAD, the largest MAD of any
  # term and how many terms the cap clips; recheck the value there when the data change.
  # Provenance of 1.0 s (LOC-05, full-day run of 2026-09-26): largest uncapped term 0.875 s,
  # largest term MAD 0.083 s, none clipped.
  referenceCapS: 1.0
  folds: null
  polishIterations: 3
  # Evidence rules for the written explanation of each static above
  # diagnostics.stationResidualFlagS (hq.locate.statics.explain_terms).
  explain:
    neighbours: 3 # nearest other stations whose median term is compared (same phase)
    # ...counting only stations at most this far (m, epicentral) from the station: a station
    # farther away samples other near-surface structure and can't stand in for this one's.
    neighbourMaxDistM: 8000.0
    lateralFraction: 0.5 # same sign and at least this share of the term: lateral structure
    minRatioTermS: 0.05 # S/P term ratio only when |P term| >= this (s)
    ratioBand: 1.3 # factor around the model's Vp/Vs (path) and around 1 (equal delays)
    # An early term at a station farther than this (m) from the events' median epicentre: the
    # sources sit in the layer model's half-space (top -610 m ASL), so the ray length in it grows
    # with distance, and the layer file marks the half-space as extrapolation. About 4x the
    # synthetic zone's deepest point below the half-space top. A hypothesis: another station that
    # far with a same-phase term later than diagnostics.stationResidualFlagS contradicts it, and
    # the term then counts as unexplained unless other evidence holds.
    farStationM: 15000.0
  sigmaFlagRatio: 1.5

# Public regional catalog (stage "catalog", hq.match.catalog, MATCH-01).
catalog:
  # ObsPy FDSN client key. "USGS" is the ComCat FDSN event service at https://earthquake.usgs.gov,
  # which carries the UUSS (network UU) solutions for this region.
  provider: USGS
  providerLabel: USGS ComCat          # CatalogEvent.source = "<contributor> via USGS ComCat"
  timeoutS: 120
  # QuakeML event types kept after the query; the raw QuakeML keeps everything served, and every
  # dropped event is logged and counted by type. null keeps every type. A served type outside the
  # QuakeML 1.2 enum (ObsPy cannot parse such an event) is a dropped type here, and fails with null.
  eventTypes: [earthquake]
  minMagnitude: null                  # no magnitude limit
  maxMagnitude: null
  # ComCat product carrying picks/arrivals (analyst picks only when the origin is manual). The stage
  # only counts which window events have it (one extra query); it never downloads the picks.
  # A misspelled type makes ComCat answer "no data", so zero matches with kept events logs a WARNING.
  arrivalsProductType: phase-data
  # Depth datum per contributor, keyed by the preferred origin's catalog:datasource. An origin from a
  # contributor not listed here, or older than validFrom, fails the stage instead of being guessed.
  datums:
    uu:
      # UUSS documents sea level as the depth datum since Oct 1, 2012 (Catalog Details page,
      # "Format for Earthquake Summary Data", Depth column).
      surfaceElevM: 0.0               # m ASL; elevM = surfaceElevM - depth
      # UUSS gives the date without a time zone; start a day later so no ambiguous origin converts.
      validFrom: "2012-10-02T00:00:00Z"
      # CatalogEvent.depthDatum = "<label>; source: <first sourceUrl>" on every row.
      label: km below sea level (UUSS catalog depth datum)
      description: >-
        km below sea level. UUSS Catalog Details, "Format for Earthquake Summary Data", Depth column:
        the depth datum is sea level for earthquakes from Oct 1, 2012 on (1.5 km above sea level
        before that in the Utah region). ComCat: the depth datum depends on the contributing
        network. ComCat serves QuakeML 1.2, which defines Origin.depth relative to nominal sea
        level (WGS84 geoid); UUSS's own statement above agrees.
      sourceUrls:
        - https://quake.utah.edu/resources/catalog-details/
        - https://earthquake.usgs.gov/data/comcat/index.php#depth
        - https://quake.ethz.ch/quakeml/Documents

# Association (stage "associate", hq.associate, LOC-03) with PyOcto 0.2.0, fed the same 1D layer
# file as the locator (velocity.layerFile) through station-specific travel-time tables built here.
# Every value below, and every argument actually passed to PyOcto, is recorded in
# ProcessingRun.associator. PyOcto's own knobs keep its units: km (Km suffix) and s.
# Values are starting points; the sweep below, completed in LOC-06, picks the knee.
associator:
  # Stage input in the run dir: known/picks.parquet (H1's known-event windows) or picks.parquet.
  picksTable: picks.parquet
  # Picks from stations in stations.parquet with usedInRun false (H1's known-event picker picks
  # them on purpose): drop (counted and logged) or reject. Unknown stations always fail.
  picksFromUnusedStations: drop
  # Picks are stored at prob >= 0.1; association uses only picks at or above this. PyOcto 0.2.0
  # takes no per-pick weight, so prob is used only as this threshold.
  minPickProb: 0.3
  # Final events need picks from at least this many distinct stations (applied after the
  # duplicate merge and shared-pick resolution below).
  minStations: 5
  # PyOcto's pick minimums (n_picks, n_p_picks, n_s_picks, n_p_and_s_picks; P/S/both count
  # stations). The config rejects values PyOcto would silently raise, and nPicks/nPPicks above the
  # smallest minStations, so the station minimum stays the binding one.
  nPicks: 4
  nPPicks: 2
  nSPicks: 1
  nPAndSPicks: 0
  toleranceS: 0.3                     # velocity model tolerance
  # Not knobs, fixed by design and recorded with the others: second_pass_overwrites null (no
  # second pass), velocity_model_location null (location uses the association model), crs null
  # (coordinates are projected in hq.associate.frame).
  associationCutoffDistanceKm: null   # null: every station takes part in the space partitioning
  # Overlap between time slices. Must cover the largest S travel time from any station to any
  # point of the search volume; the stage computes that from the tables and fails if it does not.
  timeBeforeS: 30.0
  timeSlicingS: 1200.0
  minNodeSizeKm: 4.0                  # half the runtime of 2.0, same recall (synthetic 57k-pick day)
  minNodeSizeLocationKm: 0.25
  pickMatchToleranceS: 0.5
  # PyOcto drops the smaller of two events closer than this in time, whatever picks they share.
  # 0 leaves near-simultaneous events to the explicit duplicate merge below.
  minIntereventTimeS: 0.0
  exponentialEdt: false
  edtPickStdS: 1.0                    # used by PyOcto only when exponentialEdt is true
  maxPickOverlap: 4
  refinementIterations: 3
  locationSplitDepth: 6
  locationSplitReturn: 4
  minPickFraction: 0.25
  queueMemoryProtectionDfsSize: 500000
  nodeLogInterval: 0                  # 0: PyOcto prints no node progress
  nThreads: 8                         # results do not depend on it (tested)
  # Stations: |stored enu - enu from latitude/longitude/sensorElevM| must be below this (m).
  enuConsistencyTolM: 0.01
  # Duplicate merge: two events whose origin times differ by at most mergeWithinS and that share
  # at least mergeMinSharedFraction of the smaller event's picks become one.
  mergeWithinS: 0.5
  mergeMinSharedFraction: 0.5
  volume:
    horizontalMarginM: 1000.0         # around the run bbox projected to ENU (EPSG:32612 - origin)
    topElevM: null                    # null = run.refSurfaceElevM (the ground at the origin)
    bottomElevM: -10000.0             # m ASL
  # Station-specific tables in PyOcto's binary format, cached under data/cache/ttgrids/pyocto/.
  tables:
    spacingM: 50.0                    # with cell-averaged slowness: within ~20 ms of a 10 m solve
    seedRadiusM: 100.0
    fmmOrder: 2
    maxSeedErrorS: 0.05
  # Sweep (docs/lanes/H2 -> Association): every combination of these values, all other knobs as
  # above. sweep.parquet (SweepPoint: located candidates, recoveredPublic, tierA) is written by
  # LOC-06's tier stage when tiering.sweep.enabled, which runs the sweep with its locate/match/tier
  # evaluator. This enabled: true
  # also runs it in stage associate, only to log and record associated counts per point: one
  # PyOcto run per (minPickProb, nSPicks) pair beyond the configured one, several minutes on a
  # full day at the permissive points, so it is off by default.
  sweep:
    enabled: false
    minStations: [4, 5, 6, 8]
    nSPicks: [0, 1, 2]
    minPickProb: [0.1, 0.2, 0.3]

# Catalog matching (stage "match", hq.match, MATCH-02): one-to-one assignment of located events to
# public regional catalog events with scipy's linear_sum_assignment. Distance is epicentral, from
# the horizontal ENU of both tables. Magnitude is never in the cost: magnitudes are calibrated on these
# same matches.
matching:
  # cost = |dt| / dtScaleS + distance / distScaleM, summed over the chosen pairs and minimised
  # among the one-to-one sets with the most admissible pairs.
  dtScaleS: 2.0
  distScaleM: 5000.0
  # A pair is admissible only if |dt| <= maxDtS and distance <= maxDistM (both edges admissible).
  # An inadmissible pair is never matched.
  maxDtS: 2.0
  maxDistM: 5000.0
  # Tolerance pairs for match_sensitivity.parquet. Each pair reruns the full assignment with that
  # pair as both the admissibility limit and the cost scale. Must include (maxDtS, maxDistM).
  sensitivity:
    - {dtS: 1.0, distM: 3000.0}
    - {dtS: 2.0, distM: 5000.0}
    - {dtS: 3.0, distM: 8000.0}
  # The stage recomputes ENU from latitude/longitude/elevation (hq.locate.coords.to_enu, run origin)
  # for the catalog, the located events and the stations, and fails if any stored e/n/u differs by
  # more than this (m): a table in another frame or origin. Far above round-off, far below any
  # distance that changes a match.
  enuConsistencyM: 1.0
  # Reasons for unmatched public events (hq.match.reasons), from the evidence files in the run dir.
  reasons:
    # A public event whose expected arrival windows have waveform data, picks, or picks of one
    # associated event on fewer than this many used stations gets that reason. 4 is the smallest
    # station count in the association sweep (lane doc), so no swept associator setting can form an
    # event below it. Known gap: not read from the associator's own minStations until LOC-03 merges.
    # LOC-03 configures associator.minStations 5, so a public event picked on exactly 4 stations
    # reads "picks not associated" where "below the associator's minimum" would be more useful. At
    # the LOC-03 merge: read associator.minStations and minPickProb here (or validate that they
    # agree) and record both side by side in ProcessingRun.matching.match.
    minStations: 4
    # Picks at or above this probability count for "too few picks"; picks below it (stored down to
    # 0.1) only turn that into "picks below threshold". 0.3 is LOC-03's working associator threshold
    # and the top of the lane doc's sweep {0.1, 0.2, 0.3}. Known gap: keep equal to the associator's
    # minPickProb by hand until LOC-03 merges, then read it from there.
    minPickProb: 0.3
    # Each expected window [R / vMax, straight-ray time] after the public origin (hq.match.reasons)
    # is widened by this much on both sides (s). Budget: the public regional catalog's stated errors
    # for the showcase day (QuakeML, checked 2026-09-25: horizontal <= 420 m, depth <= 770 m, so at
    # most ~0.9 km of hypocentral distance, <= 0.35 s of S time; rms <= 0.18 s), plus station delays
    # up to the 0.3 s statics cap (LOC-05) and pick error. That sums to under 0.9 s.
    arrivalPadS: 1.0
    # A located event carrying this event's in-window picks counts as its "located out of
    # tolerance" candidate only if its origin is within this many seconds of the public origin.
    # Picks inside these windows pin the origin to within about a window width (a few s) plus the
    # travel-time change of a mislocation, so 10 s only drops candidates that cannot be this event.
    maxCandidateDtS: 10.0

# Quality tiers (stage "tier", hq.tier, LOC-06). Thresholds are never set here: they are quantiles
# of the matched set M (located candidate events with a public regional catalog match in
# matches.parquet), recomputed on every run and stored with their source quantile and the size of
# M in ProcessingRun.tiering. Metrics: nStations, nP, nS (higher is better); rmsS, hErrM, vErrM,
# gapDeg (lower is better), all from SeismicEvent.quality.
# Fixed by design and recorded with the thresholds, not knobs:
# - A bar is an actual matched event's value: sort the events of M with a value on the metric from
#   best to worst and take the ceil((1 - q) * n)-th, n their count (numpy's inverted_cdf on the
#   lower-is-better side), so at least (1 - q) of them meets or beats the bar. Boundary equality
#   passes. matchedSet.meetingEveryBar records how many matched events meet every bar at once.
# - A null hErrM or vErrM (truncated PDF) fails A and B on that metric. Bars on those metrics come
#   from the matched events with a value (nUsed, nNull recorded), so a null never loosens a bar.
# - Focal depth for the nearest-station rule is the event's depth below the sensor of its
#   epicentrally nearest station with a pick used in the final location (sensorElevM - elevM, a
#   borehole's depth included; an event at or above that sensor fails the rule), from
#   arrivals.parquet and stations.parquet. A caller without them (the docs/02 3-argument call)
#   falls back to depthKm * 1000 = run.refSurfaceElevM - elevM; tiering.rules records which.
# Caveat recorded with every run: public regional catalog events are the larger ones, so bars
# drawn from them are conservative for small events.
tiering:
  # Per tier, the share q of M allowed on the worse side of each bar: the bar is p(100q) for
  # higher-is-better metrics and p(100(1 - q)) for lower-is-better ones. A: 0.25 is "at least as
  # good as the 25th-percentile-worst matched event" (>= p25, <= p75), so each Strict bar is met
  # by at least three-quarters of the recovered public events with a value on that metric (each
  # metric separately; fewer meet all of them). B: 0.0 is the worst matched event.
  # B must not exceed A (checked), so every Tier A event also meets the B bars.
  quantiles:
    A: 0.25
    B: 0.0
  # Tier A also needs its nearest station with a pick used in the final location within this
  # many focal depths, epicentral: quality.minEpiDistM <= factor * focal depth (above; the lane
  # doc's depth-gate fallback, "a station within about 1-2x the focal depth"). Tier A also needs
  # depthOnEdge false and, when locate_flags.parquet exists, mapOnVolumeTop false (z = 0 collapse).
  strictNearestStationFactor: 2.0
  # Deriving bars from fewer matched events than this (or, on hErrM/vErrM, fewer with a value)
  # fails the stage instead of inventing bars: at 10 the p75 bar is the 8th-best matched event,
  # so at most two matched events lie beyond it.
  minMatched: 10
  # Stored vs recomputed geometry must agree within this (m) or the stage fails: every event's
  # depthKm vs (run.refSurfaceElevM - elevM) / 1000, and quality.minEpiDistM vs the distance to the
  # nearest used station recomputed from stations.parquet. Far above float round-off, far below
  # any distance that changes a tier; a table from another run section or frame is off by metres.
  consistencyTolM: 0.001
  # Association sweep over associator.sweep's grid (associate -> locate -> match -> tiers at every
  # point, Tier A counted with the bars derived from the configured run so points compare), written
  # to sweep.parquet (SweepPoint). One PyOcto run per (minPickProb, nSPicks) pair and one full
  # location per point, so hours on a full day: off by default; the stage logs each point's
  # runtime and an ETA. Disabled, the stage removes a sweep.parquet left by an earlier tier run
  # (its Tier A counts used that run's bars), as stage associate does.
  sweep:
    enabled: false

# Local magnitude (stage "magnitude", hq.magnitude, MAG-01), calibrated on the matched public
# regional catalog events of ONE magnitude type:
#   station magnitude  M_ij = a log10(A_ij) + b log10(R_ij) + c + s_j
#   event magnitude    median of its station magnitudes (type "ML_cal", docs/02)
# A_ij: peak of the horizontal vector amplitude sqrt(h1^2 + h2^2) of the simulated Wood-Anderson
# trace (mm) in the S window; rotation-invariant, so borehole 1/2 components of unknown azimuth
# need no rotation. R_ij: hypocentral distance (km) from the located hypocentre to the sensor
# (ENU, sensorElevM included). Fixed by design and recorded with every run, not knobs: response
# removal in the sensor's own input units (evalresp DISP, VEL or ACC, water level there), then
# integration to displacement and the Wood-Anderson response; the S and P
# anchors are the observed picks used in the final location, else the predicted times from
# arrivals.parquet; station terms carry a ridge constraint (fit.stationTermRidge); leave-one-event-
# out refits without each calibration event and predicts it; sigma is the normalized MAD
# (1.4826 x MAD) of the event's station magnitudes.
magnitude:
  # The catalog carries ml (amplitude based) and md (duration based) on the showcase day; they are
  # different scales and are never mixed. ml: more matched events, and it measures what this model
  # measures (a peak amplitude). Every other type is left out of the calibration (counted).
  calibrationMagType: ml
  # docs/03 magnitude kill switch (~0.4): above this leave-one-event-out MAE the stage writes
  # magnitude.json but leaves every events.parquet magnitude null (logged).
  maxLooMae: 0.4
  minStations: 3
  minCalibrationEvents: 10
  minSnr: 3.0
  # Each station's windows are read from the cache in groups spanning at most this long, so a
  # 1000 Hz station-day (about 1 GB in memory) is never loaded at once.
  readChunkS: 3600.0
  window:
    sPreS: 0.5
    sPostS: 3.0
    noiseLenS: 3.0
    noiseGapS: 0.5
    padS: 2.0
  response:
    # One band for every station, so amplitudes compare across 100/200/1000 Hz sensors: flat
    # from f2 to f3, cosine tapers to 0 at f1 and f4, then the Wood-Anderson response (flat to
    # displacement above 1/periodS). f4 must lie below the lowest Nyquist of a used station
    # (checked per station). The high-pass at f2 is above the Wood-Anderson corner on purpose:
    # below a few Hz the accelerometers' and 1000 Hz sensors' displacement noise hides the S
    # waves of the smallest events. On the showcase day raising f2 from 1 to 4 Hz left the
    # leave-one-event-out MAE unchanged and cut the share of below-minSnr windows among the
    # smallest events (the record's magnitudes.censoring table), i.e. less SNR censoring.
    # The water level acts on the response in the sensor's own units: on an accelerometer's or a
    # 1000 Hz sensor's response expressed as displacement it would clip (high-pass) the band
    # itself, differently at each station. A station whose native response still falls more
    # than waterLevelDb below its maximum inside [f2, f3] has a narrower band there: logged and
    # recorded (amplitudes.perStation.*.waterLevelClipHz).
    preFiltHz: [2.0, 4.0, 35.0, 45.0]
    waterLevelDb: 60.0
    # H1's rate probe keeps the served rate; a StationXML epoch describing another rate (UU.FORU:
    # 200 Hz response, 100 Hz data) cannot deconvolve the data, so the station is excluded.
    rateRelTol: 1.0e-4
  # A window whose raw horizontal counts reach maxFraction of fullScaleCounts anywhere in its
  # processed span is "clipped" (never a magnitude). 2^23: the full scale of a 24-bit digitizer;
  # the record keeps each station's largest |counts| as a share of it (maxFullScaleFraction),
  # which shows whether a station's digitizer exceeds it.
  saturation:
    fullScaleCounts: 8388608.0
    maxFraction: 0.95
  # Uhrhammer & Collins (1990) Wood-Anderson constants (T0 0.8 s, h 0.7, V 2080). The gain only
  # shifts c; it is recorded so log10(A) values can be reproduced.
  woodAnderson:
    periodS: 0.8
    damping: 0.7
    gain: 2080.0
  fit:
    loss: soft_l1                     # robust on the observations; the ridge stays quadratic
    fScaleMag: 0.3                    # residual (magnitude units) where soft_l1 turns linear
    # 1.0: Richter's definition (M changes one unit per decade of amplitude). A fitted a is pulled
    # below 1 by amplitude scatter within events (regression dilution), which compresses the
    # magnitudes of events smaller than the calibration set; null fits it anyway.
    amplitudeSlope: 1.0
    # Ridge on the station terms (objective + stationTermRidge x sum of squared terms; with the
    # free intercept c they also sum to zero at the optimum). 1.0 = (residual sd / station-term
    # sd)^2 with both about fScaleMag, a prior, not a bound: the fitted terms are in the record
    # (fit.stationTerms). b is NOT identified by the calibration set: its events cluster, so each
    # station's distance barely changes between them (fit.bIdentification.withinStationLogRSd),
    # and this ridge decides how much of the between-station distance spread goes to b instead
    # of to the terms. b follows this knob and fit.loss as much as the data, and the
    # leave-one-event-out MAE cannot test it; magnitudes far from the calibration events rest on it.
    stationTermRidge: 1.0
    minStationObs: 5
