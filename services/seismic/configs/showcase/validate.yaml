# Validate section (VAL-02 / VAL-01, H4). Parsed by hq.config.validate.ValidateConfig; unknown
# keys are an error. Every knob of the validation reruns (hq.validate) lives here. The reruns
# call H2's associate / locate / match / assign_tiers with the same seismology.yaml as the run of
# record; this file only says how their inputs are perturbed or filtered.

# Null test (VAL-02): chance associations on time-scrambled picks -> Validation.nullTest.
nullTest:
  # Reruns of associate -> locate -> match -> assign_tiers. The reported std is the sample
  # standard deviation across reruns (n - 1), so at least 2 are required.
  nShuffles: 20
  # Per rerun, every station's picks move together by one draw from uniform(-shiftS, +shiftS)
  # seconds; within-station P/S structure survives, inter-station coherence does not.
  # Recorded as NullTest.shiftRangeS.
  shiftS: 30.0
  # Root seed; rerun i draws from numpy.random.default_rng([seed, i]). Same seed, same numbers.
  seed: 0
  # Which picks go in: "full" = every pick, "p_only" = P picks only (see hq.config.validate).
  profile: full

# Baseline comparison (VAL-01): two pickers x two association profiles through H2's
# associate -> locate -> match -> assign_tiers with the seismology.yaml of record
# -> Validation.baseline (one BaselineRow per picker x profile) and, when the rule below holds,
# AnalysisSummary.baseline. Needs H1's picks_stalta.parquet; without it the table stays empty.
baseline:
  # Association profiles every picker runs through ("full" = every pick, "p_only" = P picks
  # only). BaselineGain is quoted on "full" and claimed only when the gain holds in both "full"
  # and "p_only", so both must be listed for the summary to carry a gain.
  profiles: [full, p_only]
  # The gain (PhaseNet Tier A count / STA/LTA Tier A count) must exceed this in every profile,
  # and STA/LTA must have at least one Tier A event in every profile, for BaselineGain to be
  # claimed. docs/lanes/H4: "gain > 1 in both profiles".
  minGain: 1.0
  # docs/03 baseline kill switch ("STA/LTA within ~20% of PhaseNet's strict count"): a warning
  # is logged when |strictPhasenet - strictStalta| <= comparableFraction * strictPhasenet in any
  # profile. Logged only, never decides; the humans drop the claim at Gate D.
  comparableFraction: 0.2

# Gutenberg-Richter (VAL-01): Aki-Utsu b with Shi-Bolt sigma, Mc by maximum curvature + offset,
# on the public regional catalog's magnitudes (CatalogEvent.mag) and every candidate event's
# magnitude (SeismicEvent.magnitude.value) -> Validation.gr. Skipped without magnitudes.
gr:
  # Width of GRCurve.magBins, magnitude units; also the histogram bin for the maximum-curvature
  # Mc and the binning correction (bin width / 2) in the Aki-Utsu estimator.
  magBinWidth: 0.1
  # Added to the maximum-curvature magnitude of completeness (Mc = MaxC + offset).
  mcOffsetMag: 0.2
  # Fewest magnitudes for any estimate: below this the curve is not built (public + recovered
  # together), a set's Mc is null, and b / sigma are null when fewer recovered magnitudes lie
  # above Mc.
  minEvents: 30
  # docs/03 magnitude kill switch: when H2's magnitude.json reports a leave-one-out MAE above
  # this, G-R is skipped with a warning and only the calibration is embedded.
  maxLooMae: 0.4

# Associator overrides for the p_only profile (REQ-H2-7). run.yaml/seismology.yaml's associator
# requires S picks (nSPicks, nPAndSPicks); P-only picks through it associate nothing, so every
# p_only rerun (null test and baseline) uses a copy of SeismologyConfig.associator with these
# values. The full profile always uses the run's config unchanged. Recorded with the run through
# its git sha; the validate stage logs the override it applied.
pOnlyAssociator:
  nSPicks: 0
  nPAndSPicks: 0
