[project]
name = "hq"
version = "0.1.0"
description = "Hidden Quakes seismic pipeline"
requires-python = ">=3.11"
dependencies = [
  "obspy>=1.5",
  "seisbench",
  "pyocto",
  "scikit-fmm",
  "scipy",
  "numpy",
  "pandas",
  "pyarrow",
  "xarray",
  "netcdf4",
  "pydantic>=2",
  "pyyaml",
  "matplotlib",
  "hq-contracts",
]

[project.scripts]
hq = "hq.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.uv.sources]
hq-contracts = { path = "../../packages/contracts/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: fast offline tests (< 30 s per lane)"]

[tool.ruff]
line-length = 100
target-version = "py311"
